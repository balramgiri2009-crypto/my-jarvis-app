name: Build Jarvis APK
on: [push, pull_request]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev libreoffice-writer bzip2 libbz2-dev xz-utils
        pip3 install --user --upgrade pip cython virtualenv wheel setuptools
        
        # (THE ULTIMATE 404 FIX) पुराना वर्जन छोड़कर सीधे लेटेस्ट मास्टर वर्जन इंस्टॉल करना
        pip3 install --user git+https://github.com

    - name: Force Accept Android Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        export PATH=$PATH:~/.local/bin
        yes | buildozer android licenses || true

    - name: Compile Jarvis Android App
      run: |
        export PATH=$PATH:~/.local/bin
        buildozer android debug
      env:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-APK
        path: bin/*.apk
