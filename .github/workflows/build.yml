name: Build Jarvis APK
on: [push, pull_request]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev libreoffice-writer bzip2 libbz2-dev xz-utils
        pip3 install --user --upgrade buildozer cython virtualenv

    - name: Auto Accept Android SDK Licenses (CRITICAL FIX)
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        # यह कमांड ऑटोमैटिक गूगल के सारे लाइसेंस एक्सेप्ट कर देगी
        yes | buildozer android licenses || true

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        buildozer android debug
      env:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-APK
        path: bin/*.apk
